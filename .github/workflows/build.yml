name: Build AutoConnect APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Android Project Files
        run: |
          mkdir -p app/src/main/java/com/example/telegramautoconnect
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TelegramAutoConnect"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.telegramautoconnect'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.telegramautoconnect"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">اتصال خودکار irMARTIN</string>
              <string name="acc_desc">خواندن خودکار آخرین کانفیگ از کانال تلگرام @irMARTIN و اتصال در v2rayNG</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/acc_desc"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>
                  <package android:name="com.v2ray.ang" />
                  <package android:name="org.telegram.messenger" />
                  <package android:name="org.telegram.messenger.web" />
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".TelegramAutoService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/telegramautoconnect/MainActivity.kt
          package com.example.telegramautoconnect

          import android.content.ComponentName
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.text.TextUtils
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  if (!isAccessibilityServiceEnabled()) {
                      Toast.makeText(
                          this,
                          "لطفاً از لیست سرویس‌ها، گزینه «اتصال خودکار irMARTIN» را فعال کنید",
                          Toast.LENGTH_LONG
                      ).show()
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      finish()
                  } else {
                      TelegramAutoService.startAutomation()
                      val tgIntent = Intent(Intent.ACTION_VIEW, Uri.parse("tg://resolve?domain=irMARTIN")).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      try {
                          startActivity(tgIntent)
                      } catch (e: Exception) {
                          Toast.makeText(this, "برنامه تلگرام روی گوشی پیدا نشد!", Toast.LENGTH_LONG).show()
                      }
                      finish()
                  }
              }

              private fun isAccessibilityServiceEnabled(): Boolean {
                  val expectedComponentName = ComponentName(this, TelegramAutoService::class.java)
                  val enabledServicesSetting = Settings.Secure.getString(
                      contentResolver,
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false

                  val colonSplitter = TextUtils.SimpleStringSplitter(':')
                  colonSplitter.setString(enabledServicesSetting)
                  while (colonSplitter.hasNext()) {
                      val componentNameString = colonSplitter.next()
                      val enabledComponent = ComponentName.unflattenFromString(componentNameString)
                      if (enabledComponent != null && enabledComponent == expectedComponentName) {
                          return true
                      }
                  }
                  return false
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/telegramautoconnect/TelegramAutoService.kt
          package com.example.telegramautoconnect

          import android.accessibilityservice.AccessibilityService
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Toast

          class TelegramAutoService : AccessibilityService() {

              companion object {
                  var isAutomationActive = false
                  var step = 0

                  fun startAutomation() {
                      isAutomationActive = true
                      step = 1
                  }
              }

              private val handler = Handler(Looper.getMainLooper())
              private val configRegex = Regex("(?:vless|vmess|trojan|ss|hy2|hysteria2|tuic)://[^\\s\"'<>`\\n]+", RegexOption.IGNORE_CASE)

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (!isAutomationActive || event == null) return

                  val packageName = event.packageName?.toString() ?: return
                  val rootNode = rootInActiveWindow ?: return

                  if (step == 1 && (packageName.contains("telegram") || packageName.contains("nekogram") || packageName.contains("plus"))) {
                      val allConfigs = mutableListOf<String>()
                      extractConfigsFromScreen(rootNode, allConfigs)

                      if (allConfigs.isNotEmpty()) {
                          val latestConfig = allConfigs.last().trim()
                          copyToClipboard(latestConfig)
                          Toast.makeText(this, "آخرین کانفیگ دریافت شد! انتقال به v2rayNG...", Toast.LENGTH_SHORT).show()

                          step = 2
                          handler.postDelayed({ openV2rayNG() }, 600)
                      }
                  }

                  if ((step == 2 || step == 3) && packageName == "com.v2ray.ang") {
                      automateV2rayNG(rootNode)
                  }
              }

              private fun extractConfigsFromScreen(node: AccessibilityNodeInfo?, list: MutableList<String>) {
                  if (node == null) return

                  val text = node.text?.toString() ?: node.contentDescription?.toString()
                  if (!text.isNullOrEmpty()) {
                      configRegex.findAll(text).forEach { match ->
                          list.add(match.value)
                      }
                  }

                  for (i in 0 until node.childCount) {
                      extractConfigsFromScreen(node.getChild(i), list)
                  }
              }

              private fun copyToClipboard(config: String) {
                  val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  clipboard.setPrimaryClip(ClipData.newPlainText("AutoConfig", config))
              }

              private fun openV2rayNG() {
                  val launchIntent = packageManager.getLaunchIntentForPackage("com.v2ray.ang")
                  if (launchIntent != null) {
                      launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                      startActivity(launchIntent)
                  } else {
                      Toast.makeText(this, "برنامه v2rayNG روی گوشی نصب نیست!", Toast.LENGTH_LONG).show()
                      isAutomationActive = false
                      step = 0
                  }
              }

              private fun automateV2rayNG(rootNode: AccessibilityNodeInfo) {
                  if (step == 2) {
                      val addButtons = rootNode.findAccessibilityNodeInfosByViewId("com.v2ray.ang:id/add_config")
                      if (addButtons.isNotEmpty()) {
                          addButtons[0].performAction(AccessibilityNodeInfo.ACTION_CLICK)
                          step = 3
                          return
                      }
                  }

                  if (step == 3) {
                      val importOptions = rootNode.findAccessibilityNodeInfosByText("Clipboard")
                          .ifEmpty { rootNode.findAccessibilityNodeInfosByText("کلیپ‌بورد") }

                      if (importOptions.isNotEmpty()) {
                          val target = importOptions[0]
                          if (!target.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                              target.parent?.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                          }

                          step = 0
                          isAutomationActive = false

                          handler.postDelayed({
                              val currentRoot = rootInActiveWindow
                              val fabList = currentRoot?.findAccessibilityNodeInfosByViewId("com.v2ray.ang:id/fab")
                              if (!fabList.isNullOrEmpty()) {
                                  fabList[0].performAction(AccessibilityNodeInfo.ACTION_CLICK)
                                  Toast.makeText(this, "کانفیگ جدید متصل شد!", Toast.LENGTH_SHORT).show()
                              }
                          }, 1200)
                      }
                  }
              }

              override fun onInterrupt() {
                  isAutomationActive = false
                  step = 0
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: irMARTIN-AutoConnect-APK
          path: app/build/outputs/apk/debug/app-debug.apk
